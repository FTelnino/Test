# Render blueprint for the HDFC mutual funds FAQ assistant.
#
# Deploy with:  render blueprint launch  (or connect the repo in the dashboard)
# then set GROQ_API_KEY in the service's environment.
#
# Three facts drive this file:
#
#   1. `data/` is git-ignored, so the index is built during the BUILD, not at
#      startup. That bakes it into the image and means no disk is required. The
#      startCommand is then a plain one-liner with no cold-start branch.
#
#   2. PYTHON_VERSION is not cosmetic. chroma-hnswlib==0.7.6, pinned
#      transitively by chromadb==0.5.23, ships no cp313 wheel, and Render's
#      default is 3.13 -- so without this line the build fails outright.
#
#   3. Memory is the binding constraint, not CPU. Peak RSS serving two questions
#      was measured at 453 MB against this tier's 512 MB, so MALLOC_ARENA_MAX=1
#      matters: glibc's default is one malloc arena per core, and those arenas
#      reserve address space that shows up in RSS. It has to be an env var --
#      glibc reads it at process start, so setting it in config.py is too late.
#      See README "Deploying to Render".

services:
  - type: web
    name: hdfc-mf-faq
    runtime: python
    plan: free            # 512 MB. See README -- Standard (2 GB) if it OOMs.
    region: singapore     # nearest to the Groww/AMFI origins; lowers fetch latency

    # Build the index here, not at startup. data/ is git-ignored, so this bakes
    # the index into the image: no disk needed, and no re-fetch/re-embed on every
    # cold start of the free tier. Nothing in run_ingest.py calls the LLM, so the
    # build does not require GROQ_API_KEY -- only the running app does.
    buildCommand: pip install -r requirements.txt && python run_ingest.py --fetch-only && python run_ingest.py --chunk && python run_ingest.py --index
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false

    healthCheckPath: /_stcore/health

    autoDeploy: false     # deliberate: a redeploy re-fetches and re-validates the index

    envVars:
      # --- required ---
      # chroma-hnswlib==0.7.6 (via chromadb==0.5.23) has no cp313 wheel and
      # Render defaults to 3.13, which fails the build.
      - key: PYTHON_VERSION
        value: "3.9.6"

      # --- secret, set in the dashboard, never committed ---
      - key: GROQ_API_KEY
        sync: false

      # --- model, overridable now that config.py honours it ---
      # Must match the model every report in reports/ was verified against.
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_BACKEND
        value: groq

      # --- memory ---
      # One malloc arena instead of one-per-core. glibc arenas inflate RSS
      # materially, and this box has 512 MB. Must be set before the process
      # starts, which is why it is an env var and not a config.py setting.
      - key: MALLOC_ARENA_MAX
        value: "1"
      # One torch thread, to match the 0.5 CPU this tier actually gives.
      - key: EMBED_NUM_THREADS
        value: "1"
      # Do not phone home from a demo machine.
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      # Must match config.MODEL_CACHE_DIR. Both the build and the app then share
      # one encoder download -- 88 MB is a real cost to repeat per cold start.
      - key: HF_HOME
        value: /opt/render/project/src/data/models
